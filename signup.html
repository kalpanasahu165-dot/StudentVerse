<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | StudentVerse</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef4ff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .signup-box {
            background: white;
            width: 360px;
            max-width: 92%;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #2563eb;
            text-align: center;
            margin-bottom: 8px;
        }

        p {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 12px 0 6px;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .footer {
            margin-top: 20px;
            font-size: 14px;
        }

        a {
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="signup-box">
        <h1>StudentVerse</h1>
        <p>Create your student account</p>

        <form id="signupForm">
            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="Enter your name" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="Enter your email" required>

            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Create a password"
                   minlength="6" required>

            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword"
                   placeholder="Confirm your password" minlength="6" required>

            <button type="submit">Create Account</button>
        </form>

        <div class="footer">
            Already have an account?
            <a href="login.html">Login</a>
        </div>
    </div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    // Connect StudentVerse to Supabase
    const SUPABASE_URL = "https://ctvsqbzxrturgoiugtet.supabase.co";
    const SUPABASE_KEY = "sb_publishable_hrVq6WDqQ7IY5kYncNtnhw_UroznLkk";

    const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

    // Handle signup form
    document.getElementById("signupForm").addEventListener("submit", async function(event) {
        event.preventDefault();

        const name = document.getElementById("name").value.trim();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const confirmPassword = document.getElementById("confirmPassword").value;

        if (password !== confirmPassword) {
            alert("Passwords do not match!");
            return;
        }

        try {
            const { data, error } = await supabaseClient.auth.signUp({
                email: email,
                password: password,
                options: {
                    emailRedirectTo:"http://127.0.0.1:5500/login.html",
                    data: {
                        full_name: name
                    }
                }
            });

            if (error) {
                alert("Signup failed: " + error.message);
                return;
            }

            if (data.user && data.session) {
                alert("Account created successfully! Welcome to StudentVerse!");
            } else if (data.user) {
                alert("Signup received! Please check your email to verify your account.");
            }
        } catch (error) {
            alert("Something went wrong. Please try again.");
            console.error(error);
        }
    });
</script>
</body>
</html>
