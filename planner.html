<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Study Planner | StudentVerse</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --bg: #f4f7ff;
            --card: #ffffff;
            --text: #172554;
            --muted: #64748b;
            --primary: #2563eb;
            --border: #e2e8f0;
        }

        body.dark {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f1f5f9;
            --muted: #cbd5e1;
            --primary: #60a5fa;
            --border: #334155;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            transition: 0.3s;
        }

        header {
            background: var(--card);
            padding: 20px 6%;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        header h2 {
            color: var(--primary);
            margin: 0;
        }

        a {
            color: var(--primary);
            text-decoration: none;
        }

        button {
            padding: 10px 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: var(--primary);
            color: white;
            font-size: 14px;
        }

        button:hover {
            opacity: 0.85;
        }

        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .welcome {
            background: linear-gradient(120deg, #2563eb, #6366f1);
            color: white;
            padding: 28px;
            border-radius: 16px;
            margin-bottom: 25px;
        }

        .welcome h1 {
            margin-top: 0;
        }

        .welcome p {
            line-height: 1.6;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 25px;
        }

        .stat, .panel, .task {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
        }

        .stat h2 {
            color: var(--primary);
            font-size: 28px;
            margin: 5px 0;
        }

        .stat p {
            color: var(--muted);
            margin-bottom: 0;
        }

        .panel {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 14px 0 7px;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg);
            color: var(--text);
            font: inherit;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 18px;
        }

        .secondary {
            background: var(--muted);
        }

        .filters {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .filters select {
            max-width: 220px;
        }

        .task-list {
            display: grid;
            gap: 14px;
        }

        .task {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
        }

        .task-info {
            display: flex;
            gap: 12px;
            min-width: 0;
        }

        .task-info input {
            width: 18px;
            height: 18px;
            margin-top: 4px;
            accent-color: var(--primary);
            flex-shrink: 0;
        }

        .task-details {
            min-width: 0;
        }

        .task-details h3 {
            margin: 0 0 9px;
            overflow-wrap: anywhere;
        }

        .task-details p {
            color: var(--muted);
            font-size: 14px;
            line-height: 1.5;
            margin: 5px 0;
        }

        .task.completed .task-details h3 {
            text-decoration: line-through;
            opacity: 0.6;
        }

        .task-buttons {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .delete-button {
            background: #dc2626;
        }

        .empty {
            text-align: center;
            color: var(--muted);
            padding: 30px;
        }

        footer {
            text-align: center;
            color: var(--muted);
            padding: 25px;
        }

        @media (max-width: 650px) {
            header {
                padding: 18px;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .form-grid {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .filters {
                flex-direction: column;
            }

            .filters select {
                max-width: none;
            }

            .task {
                flex-direction: column;
            }

            .task-buttons {
                margin-left: 30px;
            }
        }
    </style>
</head>

<body>

<header>
    <h2>StudentVerse ✦</h2>

    <div>
        <a href="dashboard.html">← Dashboard</a>
        <button id="themeButton" type="button">🌙</button>
    </div>
</header>

<main class="container">

    <section class="welcome">
        <h1>📅 My Study Planner</h1>
        <p>
            Plan your day, manage college assignments,
            practise programming, and track your progress.
        </p>
    </section>

    <section class="stats">
        <div class="stat">
            <p>Total Tasks</p>
            <h2 id="totalTasks">0</h2>
        </div>

        <div class="stat">
            <p>Completed</p>
            <h2 id="completedTasks">0</h2>
        </div>

        <div class="stat">
            <p>Remaining</p>
            <h2 id="remainingTasks">0</h2>
        </div>
    </section>

    <section class="panel">
        <h2 id="formHeading">➕ Add a Study Task</h2>

        <form id="taskForm">

            <label for="taskTitle">Task Name</label>
            <input
                type="text"
                id="taskTitle"
                placeholder="e.g. Practise C programming"
                required
            >

            <div class="form-grid">
                <div>
                    <label for="taskDate">Date</label>
                    <input type="date" id="taskDate" required>
                </div>

                <div>
                    <label for="taskTime">Time</label>
                    <input type="time" id="taskTime">
                </div>
            </div>

            <label for="taskCategory">Category</label>
            <select id="taskCategory">
                <option value="College">College</option>
                <option value="Programming">Programming</option>
                <option value="Placement">Placement Preparation</option>
                <option value="UPSC">UPSC Preparation</option>
                <option value="Personal">Personal</option>
            </select>

            <label for="taskDescription">Description (Optional)</label>
            <textarea
                id="taskDescription"
                rows="3"
                placeholder="Add details about your task..."
            ></textarea>

            <div class="form-actions">
                <button type="submit" id="saveButton">
                    💾 Save Task
                </button>

                <button
                    type="button"
                    id="cancelButton"
                    class="secondary"
                    hidden
                >
                    Cancel
                </button>
            </div>

        </form>
    </section>

    <section>
        <h2>📝 My Tasks</h2>

        <div class="filters">
            <input
                type="search"
                id="searchInput"
                placeholder="Search your tasks..."
            >

            <select id="filterStatus">
                <option value="all">All Tasks</option>
                <option value="pending">Pending Tasks</option>
                <option value="completed">Completed Tasks</option>
            </select>
        </div>

        <div id="taskList" class="task-list"></div>
    </section>

</main>

<footer>
    Made for students, with 💙 | StudentVerse
</footer>

<script>
    const taskForm = document.getElementById("taskForm");
    const taskTitle = document.getElementById("taskTitle");
    const taskDate = document.getElementById("taskDate");
    const taskTime = document.getElementById("taskTime");
    const taskCategory = document.getElementById("taskCategory");
    const taskDescription = document.getElementById("taskDescription");
    const taskList = document.getElementById("taskList");
    const searchInput = document.getElementById("searchInput");
    const filterStatus = document.getElementById("filterStatus");
    const saveButton = document.getElementById("saveButton");
    const cancelButton = document.getElementById("cancelButton");
    const formHeading = document.getElementById("formHeading");

    let tasks = JSON.parse(
        localStorage.getItem("studentverseTasks") || "[]"
    );

    let editingId = null;

    function saveTasks() {
        localStorage.setItem(
            "studentverseTasks",
            JSON.stringify(tasks)
        );
    }

    function updateStats() {
        const completed = tasks.filter(task => task.completed).length;

        document.getElementById("totalTasks").textContent = tasks.length;
        document.getElementById("completedTasks").textContent = completed;
        document.getElementById("remainingTasks").textContent =
            tasks.length - completed;
    }

    function renderTasks() {
        const query = searchInput.value.toLowerCase().trim();
        const status = filterStatus.value;

        const filteredTasks = tasks
            .filter(task => {
                const matchesSearch =
                    task.title.toLowerCase().includes(query) ||
                    task.category.toLowerCase().includes(query) ||
                    task.description.toLowerCase().includes(query);

                const matchesStatus =
                    status === "all" ||
                    (status === "completed" && task.completed) ||
                    (status === "pending" && !task.completed);

                return matchesSearch && matchesStatus;
            })
            .sort((a, b) => {
                const first = a.date + (a.time || "23:59");
                const second = b.date + (b.time || "23:59");
                return first.localeCompare(second);
            });

        taskList.replaceChildren();

        if (filteredTasks.length === 0) {
            const message = document.createElement("p");
            message.className = "empty";
            message.textContent = tasks.length === 0
                ? "No tasks yet. Add your first task above! 💙"
                : "No tasks match your search or filter.";

            taskList.appendChild(message);
        }

        filteredTasks.forEach(task => {
            const card = document.createElement("article");
            card.className = "task";

            if (task.completed) {
                card.classList.add("completed");
            }

            const info = document.createElement("div");
            info.className = "task-info";

            const checkbox = document.createElement("input");
            checkbox.type = "checkbox";
            checkbox.checked = task.completed;
            checkbox.setAttribute(
                "aria-label",
                "Mark " + task.title + " as completed"
            );

            checkbox.addEventListener("change", function() {
                task.completed = checkbox.checked;
                saveTasks();
                renderTasks();
            });

            const details = document.createElement("div");
            details.className = "task-details";

            const title = document.createElement("h3");
            title.textContent = task.title;

            const category = document.createElement("p");
            category.textContent = "📚 " + task.category;

            const date = document.createElement("p");
            date.textContent = "📅 " + task.date +
                (task.time ? " at " + task.time : "");

            details.append(title, category, date);

            if (task.description) {
                const description = document.createElement("p");
                description.textContent = task.description;
                details.appendChild(description);
            }

            const buttons = document.createElement("div");
            buttons.className = "task-buttons";

            const editButton = document.createElement("button");
            editButton.textContent = "✏️ Edit";

            editButton.addEventListener("click", function() {
                taskTitle.value = task.title;
                taskDate.value = task.date;
                taskTime.value = task.time;
                taskCategory.value = task.category;
                taskDescription.value = task.description;

                editingId = task.id;

                formHeading.textContent = "✏️ Edit Task";
                saveButton.textContent = "Update Task";
                cancelButton.hidden = false;

                taskForm.scrollIntoView({ behavior: "smooth" });
                taskTitle.focus();
            });

            const deleteButton = document.createElement("button");
            deleteButton.textContent = "🗑️ Delete";
            deleteButton.className = "delete-button";

            deleteButton.addEventListener("click", function() {
                if (confirm("Delete this task?")) {
                    tasks = tasks.filter(item => item.id !== task.id);

                    saveTasks();
                    renderTasks();
                }
            });

            buttons.append(editButton, deleteButton);
            info.append(checkbox, details);
            card.append(info, buttons);
            taskList.appendChild(card);
        });

        updateStats();
    }

    taskForm.addEventListener("submit", function(event) {
        event.preventDefault();

        const title = taskTitle.value.trim();
        const description = taskDescription.value.trim();

        if (!title || !taskDate.value) {
            alert("Please enter a task name and date.");
            return;
        }

        if (editingId !== null) {
            const task = tasks.find(item => item.id === editingId);

            if (task) {
                task.title = title;
                task.date = taskDate.value;
                task.time = taskTime.value;
                task.category = taskCategory.value;
                task.description = description;
            }
        } else {
            tasks.push({
                id: Date.now().toString(),
                title: title,
                date: taskDate.value,
                time: taskTime.value,
                category: taskCategory.value,
                description: description,
                completed: false
            });
        }

        saveTasks();
        resetForm();
        renderTasks();
    });

    function resetForm() {
        taskForm.reset();
        editingId = null;

        formHeading.textContent = "➕ Add a Study Task";
        saveButton.textContent = "💾 Save Task";
        cancelButton.hidden = true;
    }

    cancelButton.addEventListener("click", resetForm);

    searchInput.addEventListener("input", renderTasks);
    filterStatus.addEventListener("change", renderTasks);

    document.getElementById("themeButton").addEventListener("click", function() {
        document.body.classList.toggle("dark");

        const isDark = document.body.classList.contains("dark");

        this.textContent = isDark ? "☀️" : "🌙";

        localStorage.setItem(
            "studentverseDarkMode",
            isDark ? "true" : "false"
        );
    });

    if (localStorage.getItem("studentverseDarkMode") === "true") {
        document.body.classList.add("dark");
        document.getElementById("themeButton").textContent = "☀️";
    }

    renderTasks();
</script>

</body>
</html>
