<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Study Hub | StudentVerse</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --bg: #f4f7ff;
            --card: #ffffff;
            --text: #172554;
            --muted: #64748b;
            --primary: #2563eb;
            --border: #e2e8f0;
        }

        body.dark {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f1f5f9;
            --muted: #cbd5e1;
            --primary: #60a5fa;
            --border: #334155;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            transition: 0.3s;
        }

        header {
            background: var(--card);
            padding: 20px 6%;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        header h2 {
            color: var(--primary);
            margin: 0;
        }

        a {
            color: var(--primary);
            text-decoration: none;
        }

        button {
            padding: 10px 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: var(--primary);
            color: white;
            font-size: 14px;
        }

        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .welcome {
            background: linear-gradient(120deg, #2563eb, #6366f1);
            color: white;
            padding: 28px;
            border-radius: 16px;
            margin-bottom: 25px;
        }

        .welcome h1 {
            margin-top: 0;
        }

        .welcome p {
            line-height: 1.6;
        }

        .panel {
            background: var(--card);
            padding: 24px;
            border: 1px solid var(--border);
            border-radius: 14px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg);
            color: var(--text);
            font: inherit;
        }

        textarea {
            min-height: 130px;
            resize: vertical;
        }

        .save-button {
            margin-top: 16px;
        }

        .search {
            margin-bottom: 20px;
        }

        .notes-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
        }

        .note {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            overflow-wrap: anywhere;
        }

        .note h3 {
            margin-top: 0;
        }

        .subject {
            color: var(--primary);
            font-size: 13px;
            font-weight: bold;
        }

        .note-content {
            white-space: pre-wrap;
            line-height: 1.6;
            color: var(--muted);
        }

        .note-actions {
            display: flex;
            gap: 10px;
            margin-top: 18px;
        }

        .delete-button {
            background: #dc2626;
        }

        .empty {
            color: var(--muted);
            text-align: center;
            padding: 25px 0;
        }

        footer {
            text-align: center;
            color: var(--muted);
            padding: 25px;
        }

        @media (max-width: 600px) {
            header {
                padding: 18px;
            }

            .container {
                margin-top: 20px;
            }

            .notes-grid {
                grid-template-columns: 1fr;
            }

            .panel {
                padding: 18px;
            }
        }
    </style>
</head>

<body>

<header>
    <h2>StudentVerse ✦</h2>
    <div>
        <a href="dashboard.html">← Dashboard</a>
        <button id="themeButton" type="button">🌙</button>
    </div>
</header>

<main class="container">

    <section class="welcome">
        <h1>📚 Your Study Hub</h1>
        <p>
            Your personal space for learning, writing notes,
            and organising your knowledge.
        </p>
    </section>

    <section class="panel">
        <h2 id="formHeading">✏️ Create a New Note</h2>

        <form id="noteForm">

            <label for="noteTitle">Note Title</label>
            <input
                type="text"
                id="noteTitle"
                placeholder="e.g. Introduction to DBMS"
                required
            >

            <label for="noteSubject">Subject</label>
            <select id="noteSubject" required>
                <option value="DBMS">DBMS</option>
                <option value="C Programming">C Programming</option>
                <option value="Python">Python</option>
                <option value="Operating Systems">Operating Systems</option>
                <option value="Computer Architecture">Computer Architecture</option>
                <option value="Data Structures">Data Structures</option>
                <option value="Other">Other</option>
            </select>

            <label for="noteContent">Your Notes</label>
            <textarea
                id="noteContent"
                placeholder="Write your notes here..."
                required
            ></textarea>

            <button class="save-button" type="submit" id="saveButton">
                💾 Save Note
            </button>

            <button
                type="button"
                id="cancelButton"
                hidden
            >
                Cancel Edit
            </button>

        </form>
    </section>

    <section>
        <h2>📝 My Saved Notes</h2>

        <input
            class="search"
            type="search"
            id="searchInput"
            placeholder="Search notes by title, subject, or content..."
        >

        <div id="notesList" class="notes-grid"></div>
    </section>

</main>

<footer>
    Made for students, with 💙 | StudentVerse
</footer>

<script>
    const noteForm = document.getElementById("noteForm");
    const noteTitle = document.getElementById("noteTitle");
    const noteSubject = document.getElementById("noteSubject");
    const noteContent = document.getElementById("noteContent");
    const notesList = document.getElementById("notesList");
    const searchInput = document.getElementById("searchInput");
    const formHeading = document.getElementById("formHeading");
    const saveButton = document.getElementById("saveButton");
    const cancelButton = document.getElementById("cancelButton");

    let notes = JSON.parse(
        localStorage.getItem("studentverseNotes") || "[]"
    );

    let editingId = null;

    function saveNotes() {
        localStorage.setItem(
            "studentverseNotes",
            JSON.stringify(notes)
        );
    }

    function renderNotes() {
        const query = searchInput.value.toLowerCase().trim();

        const filteredNotes = notes.filter(function(note) {
            return (
                note.title.toLowerCase().includes(query) ||
                note.subject.toLowerCase().includes(query) ||
                note.content.toLowerCase().includes(query)
            );
        });

        notesList.replaceChildren();

        if (filteredNotes.length === 0) {
            const message = document.createElement("p");
            message.className = "empty";
            message.textContent = notes.length === 0
                ? "No notes yet. Create your first note above! 💙"
                : "No matching notes found.";

            notesList.appendChild(message);
            return;
        }

        filteredNotes.forEach(function(note) {
            const card = document.createElement("article");
            card.className = "note";

            const subject = document.createElement("div");
            subject.className = "subject";
            subject.textContent = note.subject;

            const title = document.createElement("h3");
            title.textContent = note.title;

            const content = document.createElement("p");
            content.className = "note-content";
            content.textContent = note.content;

            const actions = document.createElement("div");
            actions.className = "note-actions";

            const editButton = document.createElement("button");
            editButton.textContent = "✏️ Edit";

            editButton.addEventListener("click", function() {
                noteTitle.value = note.title;
                noteSubject.value = note.subject;
                noteContent.value = note.content;

                editingId = note.id;

                formHeading.textContent = "✏️ Edit Your Note";
                saveButton.textContent = "Update Note";
                cancelButton.hidden = false;

                noteForm.scrollIntoView({
                    behavior: "smooth"
                });

                noteTitle.focus();
            });

            const deleteButton = document.createElement("button");
            deleteButton.textContent = "🗑️ Delete";
            deleteButton.className = "delete-button";

            deleteButton.addEventListener("click", function() {
                if (confirm("Are you sure you want to delete this note?")) {
                    notes = notes.filter(function(item) {
                        return item.id !== note.id;
                    });

                    saveNotes();
                    renderNotes();
                }
            });

            actions.append(editButton, deleteButton);
            card.append(subject, title, content, actions);
            notesList.appendChild(card);
        });
    }

    noteForm.addEventListener("submit", function(event) {
        event.preventDefault();

        const title = noteTitle.value.trim();
        const subject = noteSubject.value;
        const content = noteContent.value.trim();

        if (!title || !content) {
            alert("Please enter a title and your notes.");
            return;
        }

        if (editingId !== null) {
            const note = notes.find(function(item) {
                return item.id === editingId;
            });

            if (note) {
                note.title = title;
                note.subject = subject;
                note.content = content;
            }
        } else {
            notes.unshift({
                id: Date.now().toString(),
                title: title,
                subject: subject,
                content: content
            });
        }

        saveNotes();
        resetForm();
        renderNotes();
    });

    function resetForm() {
        noteForm.reset();
        editingId = null;

        formHeading.textContent = "✏️ Create a New Note";
        saveButton.textContent = "💾 Save Note";
        cancelButton.hidden = true;
    }

    cancelButton.addEventListener("click", resetForm);

    searchInput.addEventListener("input", renderNotes);

    document.getElementById("themeButton").addEventListener("click", function() {
        document.body.classList.toggle("dark");

        const isDark = document.body.classList.contains("dark");

        this.textContent = isDark ? "☀️" : "🌙";

        localStorage.setItem(
            "studentverseDarkMode",
            isDark ? "true" : "false"
        );
    });

    if (localStorage.getItem("studentverseDarkMode") === "true") {
        document.body.classList.add("dark");
        document.getElementById("themeButton").textContent = "☀️";
    }

    renderNotes();
</script>

</body>
</html>
